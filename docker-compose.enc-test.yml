# Encryption integration suite services (stage 9, task 9.3).
# Used by `make test.enc.integration`: Redis for the metadata engine tests and
# MinIO for object-storage tests. Ports are pinned so the Makefile target can
# point REDIS_ADDR/S3_ENDPOINT at them without touching the local 6379/9000.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6390:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
