syntax = "proto3";
package pb;
option go_package = "./pb";

import "meta_common.proto";

// =====================================================
// Streaming Dump/Load Request/Response Messages
// =====================================================

message DumpMetaRequest {
  uint64 root = 1;
  int32 threads = 2;
  bool keep_secret = 3;
  bool fast = 4;
  bool skip_trash = 5;
}
message DumpMetaChunk { bytes data = 1; }

message LoadMetaChunk { bytes data = 1; }
message LoadMetaResponse { uint32 errno = 1; }

message DumpMetaV2Request {
  MetaContext ctx = 1;
  bool keep_secret = 2;
  int32 threads = 3;
}
message DumpMetaV2Chunk { bytes data = 1; }

message LoadMetaV2Chunk { bytes data = 1; }
message LoadMetaV2Response { uint32 errno = 1; }