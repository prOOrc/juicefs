syntax = "proto3";
package pb;
option go_package = "./pb";

import "pb/meta_common.proto";

// =====================================================
// ACL Request/Response Messages
// =====================================================

message SetFaclRequest {
  MetaContext ctx = 1;
  uint64 ino = 2;
  uint32 acl_type = 3;
  ProtoACLRule rule = 4;
}
message SetFaclResponse { uint32 errno = 1; }

message GetFaclRequest {
  MetaContext ctx = 1;
  uint64 ino = 2;
  uint32 acl_type = 3;
}
message GetFaclResponse {
  uint32 errno = 1;
  ProtoACLRule rule = 2;
}