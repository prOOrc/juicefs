syntax = "proto3";
package pb;
option go_package = "./pb";

import "meta_common.proto";

// =====================================================
// Xattrs Request/Response Messages
// =====================================================

message GetXattrRequest {
  MetaContext ctx = 1;
  uint64 inode = 2;
  string name = 3;
}
message GetXattrResponse {
  uint32 errno = 1;
  bytes value = 2;
}

message SetXattrRequest {
  MetaContext ctx = 1;
  uint64 inode = 2;
  string name = 3;
  bytes value = 4;
  uint32 flags = 5;
}
message SetXattrResponse { uint32 errno = 1; }

message RemoveXattrRequest {
  MetaContext ctx = 1;
  uint64 inode = 2;
  string name = 3;
}
message RemoveXattrResponse { uint32 errno = 1; }

message ListXattrRequest {
  MetaContext ctx = 1;
  uint64 inode = 2;
}
message ListXattrResponse {
  uint32 errno = 1;
  bytes names = 2;
}