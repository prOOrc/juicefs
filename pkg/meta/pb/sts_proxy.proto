syntax = "proto3";
package pb;
option go_package = "./pb";

// StsProxyService is the user-path pass-through for short-lived S3 storage
// credentials (task 7.12, ADR-003): the Meta Proxy forwards the request to the
// platform KeyManager, filling user_id from the authenticated OIDC session —
// the client never names the identity. KeyManager stays internal (proxy-trust
// model, as for the file FEK RPCs).
service StsProxyService {
  // GetSTSCredentials returns volume-scoped short-lived S3 credentials for the
  // authenticated session (FR-REV-3, ADR-003). The proxy fills user_id from the
  // authenticated OIDC session; any client-supplied identity is ignored.
  rpc GetSTSCredentials(StsCredentialsRequest) returns (StsCredentialsResponse);
}

message StsCredentialsRequest { string company_id = 1; }

message StsCredentialsResponse {
  string access_key_id = 1;
  string secret_access_key = 2;
  string session_token = 3;
  int64 expiration_unix = 4;
}
