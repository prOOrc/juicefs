syntax = "proto3";
package meta;
option go_package = "github.com/juicedata/juicefs/pkg/meta/grpc";

import "meta_common.proto";

// =====================================================
// Locks Request/Response Messages
// =====================================================

message FlockRequest {
  MetaContext ctx = 1;
  uint64 inode = 2;
  uint64 owner = 3;
  uint32 ltype = 4;
  bool block = 5;
}
message FlockResponse { uint32 errno = 1; }

message GetlkRequest {
  MetaContext ctx = 1;
  uint64 inode = 2;
  uint64 owner = 3;
  uint32 ltype = 4;
  uint64 start = 5;
  uint64 end = 6;
}
message GetlkResponse {
  uint32 errno = 1;
  uint32 ltype = 2;
  uint64 start = 3;
  uint64 end = 4;
  uint32 pid = 5;
}

message SetlkRequest {
  MetaContext ctx = 1;
  uint64 inode = 2;
  uint64 owner = 3;
  bool block = 4;
  uint32 ltype = 5;
  uint64 start = 6;
  uint64 end = 7;
  uint32 pid = 8;
}
message SetlkResponse { uint32 errno = 1; }

message ListLocksRequest {
  MetaContext ctx = 1;
  uint64 inode = 2;
}
message ListLocksResponse {
  uint32 errno = 1;
  repeated ProtoPlock plocks = 2;
  repeated ProtoFlock flocks = 3;
}