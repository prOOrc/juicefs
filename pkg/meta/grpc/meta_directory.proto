syntax = "proto3";
package meta;
option go_package = "github.com/juicedata/juicefs/pkg/meta/grpc";

import "meta_common.proto";

// =====================================================
// Directory Request/Response Messages
// =====================================================

message GetParentsRequest {
  MetaContext ctx = 1;
  uint64 inode = 2;
}
message GetParentsResponse {
  uint32 errno = 1;
  map<uint64, int32> parents = 2;
}

message GetDirStatRequest {
  MetaContext ctx = 1;
  uint64 inode = 2;
}
message GetDirStatResponse {
  uint32 errno = 1;
  int64 length = 2;
  int64 space = 3;
  int64 inodes = 4;
}